name: "Blacksmith — Reviewer"
description: "Senior-engineer code review on pull requests for the Blacksmith Experience apprenticeship team, powered by GitHub Models."
author: "blacksmith-dev"

branding:
  icon: check-circle
  color: orange

inputs:
  model:
    description: "GitHub Models catalog id (e.g. openai/gpt-4o-mini)."
    required: false
    default: "openai/gpt-4o-mini"
  app-id:
    description: >-
      GitHub App ID to authenticate as. Defaults to the public lars-blacksmith-exp
      app so reviews appear under that identity. App IDs are not secrets.
    required: false
    default: "3948048"
  app-private-key:
    description: >-
      PEM-formatted private key for the GitHub App named in app-id. When set, the
      action mints a short-lived installation token and uses it instead of
      github-token. Apprentice repos pass secrets.BLACKSMITH_REVIEWER_PRIVATE_KEY here.
    required: false
    default: ""
  github-token:
    description: >-
      Fallback token used only when app-private-key is empty. Defaults to the
      workflow's GITHUB_TOKEN, which posts as github-actions[bot] — useful for
      local development but not for production review.
    required: false
    default: ${{ github.token }}
  inference-token:
    description: >-
      Token used to call the GitHub Models inference endpoint. Defaults to the
      workflow's GITHUB_TOKEN because installation tokens minted from a GitHub
      App do not (yet) carry models:read — only user-to-server tokens and
      workflow tokens do. Keep this default unless you have a specific reason
      to override it.
    required: false
    default: ${{ github.token }}
  min-severity:
    description: "Lowest severity to post: low | medium | high | critical."
    required: false
    default: "low"
  project-id:
    description: >-
      UUID of the Blacksmith Experience project this repo is linked to.
      Apprentice repos pass secrets.BLACKSMITH_PROJECT_ID here. Used to
      attribute review events to the right apprentice when emitting to
      the Experience backend. Leave empty for repos outside the Experience.
    required: false
    default: ""
  tracking-url:
    description: >-
      Base URL of the Blacksmith Experience tracking endpoint. The action
      POSTs review-posted events to {tracking-url}/review-posted after
      each review. Leave empty to disable tracking.
    required: false
    # TODO(blacksmith-experience): set a default once the endpoint is live.
    default: ""
  oidc-audience:
    description: >-
      Audience claim for the GitHub Actions OIDC token used to
      authenticate tracking callbacks. Must match the backend's
      GITHUB_OIDC_AUDIENCE setting. When set, the workflow must
      grant `permissions: id-token: write` — otherwise the action
      can't mint the token and falls back to posting unauthenticated.
      Leave empty to skip OIDC entirely.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Mint app installation token
      id: app-token
      if: inputs.app-private-key != ''
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Blacksmith
      shell: bash
      run: pip install --quiet "$GITHUB_ACTION_PATH/.."

    - name: Run reviewer
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token || inputs.github-token }}
        INFERENCE_TOKEN: ${{ inputs.inference-token }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        MODEL: ${{ inputs.model }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        PROJECT_ID: ${{ inputs.project-id }}
        TRACKING_URL: ${{ inputs.tracking-url }}
        OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        # GitHub Actions injects these automatically when the
        # workflow grants `permissions: id-token: write`. Pass them
        # through explicitly so a composite-action env block doesn't
        # accidentally shadow them — `mint_id_token` reads them
        # directly via `os.environ`.
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
      run: python -m blacksmith reviewer
