name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  release:
    # Every green push to main becomes a release. The patch number
    # auto-increments from the latest existing vX.Y.Z tag, and the
    # matching major tag (v1 for v1.x.y) slides forward to the new
    # commit. PRs and non-main pushes skip via the `if` gate.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Serialize releases so two back-to-back main pushes don't both
      # try to claim the same next version.
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history + tags for version computation

      - name: Compute next version
        id: ver
        run: |
          git fetch --tags --quiet
          LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)
          if [ -z "$LAST" ]; then
            NEXT="v1.0.0"
          else
            NEXT=$(echo "$LAST" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
          fi
          MAJOR="v$(printf '%s' "$NEXT" | sed -E 's/^v([0-9]+)\..*/\1/')"
          {
            echo "next=$NEXT"
            echo "major=$MAJOR"
          } >> "$GITHUB_OUTPUT"
          echo "next: $NEXT  major: $MAJOR  previous: ${LAST:-<none>}"

      - name: Tag commit and move major tag
        # Standard composite-action release pattern: consumers pin to
        # @vN and the major tag slides forward to each new patch on
        # the same major line. The major tag force-push is intentional;
        # anyone using @v1 has opted into a moving reference, as
        # documented in CONTRIBUTING.md.
        env:
          NEXT: ${{ steps.ver.outputs.next }}
          MAJOR: ${{ steps.ver.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$NEXT" "$GITHUB_SHA"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push origin "$NEXT"
          git push origin "$MAJOR" --force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          gh release create "$NEXT" \
            --title "$NEXT" \
            --generate-notes
